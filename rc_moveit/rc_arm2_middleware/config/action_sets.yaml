# 存储
  - id: 1
    name: catch_200_KFS_front_and_store_stand
    steps:
      - type: set_vacuum
        label: vacuum_on
        enabled: true

      - type: move_fixed_pose_mrl #j5 负责左右横移动
        label: move_to_default_pose
        xyz: [0.25, 0.0, 0.2]
        j5_target_pos: 0.0
        target_spin: 0.0 #已经无用target_points.y + offset.z判断

      - type: move_fixed_pose_mrl #j5 负责左右横移动
        label: move_to_default_pose
        xyz: [0.66, 0.0, 0.2]
        j5_target_pos: 0.0
        target_spin: 0.0 #已经无用target_points.y + offset.z判断
      
      - type: move_fixed_pose_mrl #j5 负责左右横移动
        label: move_to_default_pose
        xyz: [0.66, 0.0, 0.12]
        j5_target_pos: 0.0
        target_spin: 0.0 #已经无用target_points.y + offset.z判断

      - type: delay
        label: wait_after_move
        duration_sec: 0.5

      - type: set_payload_active
        label: payload_on
        enabled: true

      - type: move_fixed_pose_mrl #机械臂y=-0.0001
        label: move_to_default_pose # 举高
        xyz: [0.1, 0.0, 0.7]
        j5_target_pos: 0.0
        target_spin: 150.0

      - type: move_fixed_pose_mrl #机械臂y=-0.0001
