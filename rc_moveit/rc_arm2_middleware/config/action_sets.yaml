# 动作集 ID 说明：
# - id 1：视觉抓取 200 KFS 正前方，站立后入库
# - id 2：视觉抓取 -200 KFS 正前方，入库
# - id 7：视觉抓取 200 KFS 正前方，站立后左侧丢弃
# - id 8：视觉抓取 -200 KFS 正前方，左侧丢弃
# - id 9：抓取前抬头预备位
# - id 10：未存储侧放
# - id 13：视觉抓取 200 KFS 正前方，站立后保持
# - id 14：视觉抓取 -200 KFS 正前方，保持
# - id 19：视觉抓取 200 KFS 正前方，非站立入库
# - id 20：视觉抓取 200 KFS 正前方，保持
# - id 21：视觉抓取 400 KFS 正前方，入库
# - id 22：回到初始位
# - id 23：伸出抓取方块
# - id 24：抓取方块后下探
# - id 25：视觉抓取 400 KFS 正前方入库前预备位
# - id 51：视觉抓取 200 KFS 正前方，站立后入库（路径版）
# - id 52：视觉抓取 -200 KFS 正前方，入库（路径版）
# - id 57：视觉抓取 200 KFS 正前方，站立后左侧丢弃（路径版）
# - id 58：视觉抓取 -200 KFS 正前方，左侧丢弃（路径版）
# - id 63：视觉抓取 200 KFS 正前方，站立后保持（路径版）
# - id 64：视觉抓取 -200 KFS 正前方，保持（路径版）
# - id 69：1019 动作路径
# - id 70：视觉抓取 200 KFS 正前方，保持（路径版）
# - id 71：视觉抓取 400 KFS 正前方，入库（路径版）
# - id 74：抓取方块后下探（路径版）
# - id 75：视觉抓取 400 KFS 正前方入库前预备位（路径版）
# - id 81：视觉观看动作

action_sets:
  - id: 1 # 视觉抓取 200 KFS 正前方，站立后入库
    name: vision_catch_200_KFS_front_stand_and_store
    steps:
      - type: set_payload_active
        label: payload_off
        enabled: false

      - type: send_can_frame
        label: notify
        can_id: 0x601
        can_data: [0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xfc]

      - type: set_vacuum
        label: vacuum_on
        enabled: true

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [0.25, 0.0, 0.0]
        j5_target_pos: 0.0
        target_spin: 65.0

      - type: update_target_point
        label: update_vision_point
        timeout_sec: 1.0

      - type: move_target_offset_mrl
        label: move_to_default_pose
        offset_xyz: [-0.05, 0.0, 0.04]
        j5_target_pos: 0.0
        target_spin: 95.0

      - type: move_target_offset_mrl
        label: move_to_default_pose
        offset_xyz: [0.07, 0.0, 0.04]
        j5_target_pos: 0.0
        target_spin: 95.0

      - type: delay
        label: wait_after_move
        duration_sec: 0.5

      - type: set_payload_active
        label: payload_on
        enabled: true

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [0.1, 0.0, 0.7]
        j5_target_pos: 0.0
        target_spin: 100

      - type: send_can_frame
        label: notify
        can_id: 0x602
        can_data: [0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xfc]

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [-0.1, -0.0001, 0.7]
        j5_target_pos: 0.0
        target_spin: 100

      - type: delay
        label: wait_after_move
        duration_sec: 0.5

      - type: move_fixed_pose_mf
        label: move_to_default_pose
        xyz: [-0.3, -0.0001, 0.48]
        j5_target_pos: 0.015
        target_spin: 0.0

      - type: delay
        label: wait_after_move
        duration_sec: 0.5

      - type: move_fixed_pose_mf
        label: move_to_default_pose
        xyz: [-0.32, -0.0001, 0.33]
        j5_target_pos: 0.015
        target_spin: 10.0

      - type: set_payload_active
        label: payload_off
        enabled: false

      - type: set_vacuum
        label: vacuum_off
        enabled: false

      - type: send_can_frame
        label: notify
        can_id: 0x603
        can_data: [0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xfc]

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [-0.1, -0.0001, 0.8]
        j5_target_pos: 0.0
        target_spin: 100.0

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [0.1, 0.0, 0.8]
        j5_target_pos: 0.0
        target_spin: 100.0

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [0.2171, 0.0, 0.1171]
        j5_target_pos: 0.0
        target_spin: 65.0

      - type: send_can_frame
        label: dm_serial_complete
        can_id: 0x500
        can_data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

