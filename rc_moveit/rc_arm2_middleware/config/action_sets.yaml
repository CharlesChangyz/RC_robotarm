action_sets:
  # Assumptions for fixed points:
  # - default point: [0.25, 0.0, 0.24]
  # - staging point: [0.30, -0.10, 0.20]
  # - warehouse point: temporarily reuse [0.30, -0.10, 0.20], replace as needed
  - id: 1
    name: watching_front
    steps:
      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [0.25, 0.0, 0.0]
        target_spin: 0.0

  - id: 2
    name: watching_left
    steps:
      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [0.0, -0.25, 0.0]
        target_spin: 0.0
  
  - id: 3
    name: watching_right
    steps:
      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [0.0, 0.25, 0.0]
        target_spin: 0.0

  - id: 4
    name: catch_200_KFS
    steps:
      - type: set_vacuum
        label: vacuum_on
        enabled: true
      
      - type: move_target_offset_noj5
        label: move_to_default_pose
        xyz: [-0.05, 0.0, -0.05]
        target_spin: 90.0

      - type: move_target_offset_noj5
        label: move_to_default_pose
        xyz: [0.15, 0.0, -0.05]
        target_spin: 90.0

      - type: set_payload_active
        label: payload_on
        enabled: true

      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [0.1, 0.0, 0.7]
        target_spin: 170.0

      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [-0.1, 0.0, 0.7]
        target_spin: 170.0

      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [-0.36, 0.0, 0.45]
        target_spin: 0.0

      - type: set_payload_active
        label: payload_off
        enabled: false
      
      - type: set_vacuum
        label: vacuum_off
        enabled: false

      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [-0.1, 0.0, 0.7]
        target_spin: 50.0

      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [0.1, 0.0, 0.7]
        target_spin: 50.0

      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [0.25, 0.0, 0.0]
        target_spin: 0.0

  - id: 5
    name: catch_-200_KFS
    steps:
      - type: set_vacuum
        label: vacuum_on
        enabled: true
      
      - type: move_target_offset_noj5
        label: move_to_default_pose
        xyz: [0.0, 0.0, 0.05]
        target_spin: 0.0

      - type: move_target_offset_noj5
        label: move_to_default_pose
        xyz: [0.0, 0.0, -0.05]
        target_spin: 0.0

      - type: set_payload_active
        label: payload_on
        enabled: true

      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [0.1, 0.0, 0.7]
        target_spin: 170.0

      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [-0.1, 0.0, 0.7]
        target_spin: 170.0

      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [-0.36, 0.0, 0.45]
        target_spin: 0.0

      - type: set_payload_active
        label: payload_off
        enabled: false
      
      - type: set_vacuum
        label: vacuum_off
        enabled: false

      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [-0.1, 0.0, 0.7]
        target_spin: 50.0

      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [0.1, 0.0, 0.7]
        target_spin: 50.0

      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [0.25, 0.0, 0.0]
        target_spin: 0.0
