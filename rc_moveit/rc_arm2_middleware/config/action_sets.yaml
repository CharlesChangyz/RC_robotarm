        label: wait_after_move
        duration_sec: 0.5

      - type: move_fixed_pose_mrl #机械臂y=-0.0001
        label: move_to_default_pose #放置
        xyz: [-0.31, -0.0001, 0.40]
        j5_target_pos: 0.0001
        target_spin: 0.0

      - type: move_fixed_pose_mrl #机械臂y=-0.0001
