# rc_arm_2 ros2_control 控制器配置
# 这份 YAML 只描述 controller_manager 与控制器参数。

controller_manager:
  ros__parameters:
    # controller_manager 主更新频率，单位 Hz
    update_rate: 400

    # 关节状态广播器：
    # 负责发布 /joint_states
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 机械臂唯一正式执行控制器：
    # 上层执行链通过 ~/joint_trajectory 流式下发单点参考
    arm_controller:
      type: rc_arm_controller/RcArmController

arm_controller:
  ros__parameters:
    # 控制器管理的关节顺序；
    # 必须与硬件接口和上层执行器使用的关节顺序一致
    joints:
      - j1_joint
      - j2_joint
      - j3_joint
      - j4_joint

    # 流式参考在该时间内未刷新则自动进入 hold，单位秒
    reference_timeout: 0.1
