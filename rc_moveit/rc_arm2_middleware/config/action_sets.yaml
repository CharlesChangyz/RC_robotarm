action_sets:
  # Assumptions for fixed points:
  # - default point: [0.25, 0.0, 0.24]
  # - staging point: [0.30, -0.10, 0.20]
  # - warehouse point: temporarily reuse [0.30, -0.10, 0.20], replace as needed
  - id: 81
    name: watching_front
    steps:
      - type: move_fixed_po
        label: move_to_default_pose
        xyz: [0.25, 0.0, 0.05]
        target_spin: 0.

  - id: 82
    name: watching_left
    steps:
      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [0.0, -0.25, 0.05]
        target_spin: 0.0
  
  - id: 83
    name: watching_right
    steps:
      - type: move_fixed_pose
        label: move_to_default_pose
        xyz: [0.0, 0.25, 0.05]
        target_spin: 0.0
#######################################################################################################
# 存储
  - id: 1
    name: catch_200_KFS_front_and_store
    steps:
      - type: set_vacuum
        label: vacuum_on
        enabled: true
      
      - type: move_target_offset_mrl #j5 负责左右横移动
        label: move_to_default_pose
        offset_xyz: [-0.05, 0.0, -0.05]
        j5_target_pos: 0.0 #j5 在视觉target_points.y + offset.y的基础上，再+ j5_target_pos
        target_spin: 90.0 #已经无用target_points.y + offset.z判断

      - type: move_target_offset_mrl #机械臂y=0
        label: move_to_default_pose # 向前伸出吸住
        offset_xyz: [0.15, 0.0, -0.05]
        target_spin: 90.0

      - type: set_payload_active
        label: payload_on
        enabled: true

      - type: move_fixed_pose_mrl #机械臂y=0
        label: move_to_default_pose # 举高
        xyz: [0.1, 0.0, 0.7]
        j5_target_pos: 0.0
        target_spin: 170.0

      - type: move_fixed_pose_mrl #机械臂y=0
        label: move_to_default_pose # 转180度
        xyz: [-0.1, 0.0, 0.7]
        j5_target_pos: 0.0
        target_spin: 170.0

      - type: move_fixed_pose_mrl #机械臂y=0
        label: move_to_default_pose #放置
        xyz: [-0.36, 0.0, 0.45]
        j5_target_pos: 0.0
        target_spin: 0.0

      - type: set_payload_active
        label: payload_off # 松力
        enabled: false
      
      - type: set_vacuum
        label: vacuum_off # 关闭吸盘
        enabled: false

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [-0.1, 0.0, 0.7] # 居高
        j5_target_pos: 0.0
        target_spin: 50.0

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [0.1, 0.0, 0.7] # 转180度
        j5_target_pos: 0.0
        target_spin: 50.0

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [0.25, 0.0, 0.05] # 看前面
        j5_target_pos: 0.0
        target_spin: 0.0

