xbox_teleop_node_rc_arm_2:
  ros__parameters:
    update_rate: 50.0
    use_fast_ik_mode: true

    max_linear_velocity: 0.15
    max_angular_velocity: 1.2

    joint_smoothing_alpha: 0.15
    max_joint_velocity: 1.5
    max_joint_acceleration: 5.0

    input_smoothing_factor: 0.3

    max_ik_jump_threshold: 0.5
    singularity_warning_count: 5

    enable_collision_check: true

    planning_group: "arm"
    base_frame: "base_link"
    end_effector_frame: "end_effector"

    deadzone: 0.15
    debug_input: false

    # rc_arm_2 先关闭主从模式（四轴单臂）
    master_slave_enabled: false
    direct_can_enabled: false
