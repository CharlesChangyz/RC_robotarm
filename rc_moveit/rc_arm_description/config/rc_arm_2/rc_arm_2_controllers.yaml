# rc_arm_2 ros2_control 控制器配置
# 这份 YAML 只描述 controller_manager 与控制器参数。

controller_manager:
  ros__parameters:
    # controller_manager 主更新频率，单位 Hz
    update_rate: 400

    # 关节状态广播器：
    # 负责发布 /joint_states
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 机械臂唯一正式执行控制器：
    # MoveIt 通过 FollowJointTrajectory action 调它
    arm_controller:
      type: rc_arm_controller/RcArmController

arm_controller:
  ros__parameters:
    # 控制器管理的关节顺序；
    # 必须与硬件接口和 MoveIt 使用的关节顺序一致
    joints:
      - j1_joint
      - j2_joint
      - j3_joint
      - j4_joint

    # 允许 Servo 通过 ~/joint_trajectory 话题直接下发轨迹
    allow_topic_commands: true

    # FollowJointTrajectory feedback 发布频率，单位 Hz
    feedback_publish_rate: 20.0

    constraints:
      # 判断“机械臂已停止”的速度容差，单位 rad/s
      stopped_velocity_tolerance: 0.25

      # 允许目标完成的额外时间裕量，单位秒
      goal_time: 1.0

      # j1 到目标点的允许误差，单位 rad
      j1_joint:
        goal: 0.1

      # j2 到目标点的允许误差，单位 rad
      j2_joint:
        goal: 0.1

      # j3 到目标点的允许误差，单位 rad
      j3_joint:
        goal: 0.1

      # j4 到目标点的允许误差，单位 rad
      j4_joint:
        goal: 0.5
