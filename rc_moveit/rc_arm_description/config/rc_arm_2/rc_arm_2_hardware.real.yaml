# rc_arm_2 实机后端硬件配置
# 这份 YAML 只描述硬件插件参数，不包含关节结构、方向和接口定义。

# 后端类型：
# real = 实机 ros2_control 后端
backend: real

# 外部反馈话题：
# 实机模式下一般不会主动使用，但保留统一字段，便于 real / mujoco 两份配置共用同一 schema
external_feedback_topic: /rc_arm_2/mujoco_joint_states

# 外部反馈超时时间，单位秒；
# 当使用外部反馈模式时，超过该时间未收到消息则认为反馈失效
external_feedback_timeout: 0.2

# MuJoCo 命令输出话题：
# 实机模式通常不会用到，但保留统一字段
mujoco_command_topic: /rc_arm_2/mujoco_joint_command
vacuum_activate_topic: /rc_arm_2/vacuum_activate
payload_command_topic: /rc_arm_2/payload_active_command
payload_active_topic: /rc_arm_2/payload_active
j5_command_topic: /rc_arm_2/j5/command_position
j5_position_topic: /rc_arm_2/j5/actual_position
j5_kp: 5.0
j5_kd: 1.0
payload_frame: end_effector

# USB2CANFD 设备序列号
dm_sn: 9940F4E149D904A69924737E3DE6629F

# CAN 仲裁域波特率
dm_nom_baud: 1000000

# CAN 数据域波特率
dm_dat_baud: 2000000

# dmbot_serial 控制模式：
# 0=MIT, 1=POS_VEL, 2=VEL, 3=POS_FORCE
dm_control_mode: 0

# 实机启动时先等待 USB2CANFD 稳定，避免过早发使能包
dm_startup_delay_sec: 2.0

# 激活阶段重复发送使能，降低首次使能包丢失的概率
dm_enable_retry_count: 2
dm_enable_retry_interval_sec: 0.5

# 关节到电机 CAN ID 的映射
motor_id_j1: 0
motor_id_j2: 1
motor_id_j3: 2
motor_id_j4: 3

# 空载位置环比例增益 Kp
unloaded_position_kp: 60.0

# 空载位置环微分增益 Kd
unloaded_position_kd: 3.0

# 硬件层统一速度限制，单位 rad/s
velocity_limit: 8.0

# 参考轨迹加速度上限，供硬件层监测使用，单位 rad/s^2
max_acceleration: 20.0

# 是否启用低刚度模式
low_stiffness_mode: true

# 空载低刚度模式全局 Kp
unloaded_low_stiffness_kp: 0.0

# 空载低刚度模式全局 Kd
unloaded_low_stiffness_kd: 0.0

# 空载低刚度模式额外常量力矩偏置，单位 Nm
unloaded_low_stiffness_torque_bias: 0.0

# 带载动力学/场景参数
payload_mass: 0.85
payload_diaginertia_x: 0.022
payload_diaginertia_y: 0.022
payload_diaginertia_z: 0.022
payload_com_offset_x: 0.01
payload_com_offset_y: -0.180
payload_com_offset_z: 0.025
payload_box_size_x: 0.0
payload_box_size_y: 0.0
payload_box_size_z: 0.0
payload_position_kp: 60.0
payload_position_kd: 3.0
payload_low_stiffness_kp: 0.0
payload_low_stiffness_kd: 0.0
payload_low_stiffness_torque_bias: 0.0
mujoco_payload_body_name: payload_block
mujoco_payload_site_name: attachment_site
mujoco_payload_initial_pos_x: 0.30
mujoco_payload_initial_pos_y: 0.00
mujoco_payload_initial_pos_z: 0.20

#j1 低刚度 Kp 覆盖值；
#0 表示回退到 unloaded_low_stiffness_kp
unloaded_low_stiffness_kp_j1: 3.0

# j1 空载低刚度 Kd 覆盖值；
# 0 表示回退到 unloaded_low_stiffness_kd
unloaded_low_stiffness_kd_j1: 0.5
payload_low_stiffness_kp_j1: 3.0
payload_low_stiffness_kd_j1: 0.5

# j2 低刚度 Kp 覆盖值
unloaded_low_stiffness_kp_j2: 50.0

# j2 空载低刚度 Kd 覆盖值
unloaded_low_stiffness_kd_j2: 5.0
payload_low_stiffness_kp_j2: 200.0
payload_low_stiffness_kd_j2: 28.28

# j3 低刚度 Kp 覆盖值
unloaded_low_stiffness_kp_j3: 30.0

# j3 空载低刚度 Kd 覆盖值
unloaded_low_stiffness_kd_j3: 3.0
payload_low_stiffness_kp_j3: 150.0
payload_low_stiffness_kd_j3: 24.5

# j4 低刚度 Kp 覆盖值
unloaded_low_stiffness_kp_j4: 5.0

# j4 空载低刚度 Kd 覆盖值
unloaded_low_stiffness_kd_j4: 1.0
payload_low_stiffness_kp_j4: 5.0
payload_low_stiffness_kd_j4: 1.0

# 是否启用 Pinocchio 重力补偿项
use_pinocchio_gravity: false

# 重力补偿前馈比例，范围 0~1
gravity_feedforward_ratio: 1.0

# 是否启用 Pinocchio 全逆动力学前馈
use_pinocchio_inverse_dynamics: true  

# Pinocchio 使用的 URDF 路径；
# 这里写相对 rc_arm_description 包目录的路径
urdf_path: urdf/rc_arm_2/rc_arm_2.pinocchio.urdf

# 当 controller_manager 提供的周期异常时，硬件层采用的回退控制周期，单位秒
fallback_control_period: 0.005
