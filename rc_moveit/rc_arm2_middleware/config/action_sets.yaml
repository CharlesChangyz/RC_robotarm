action_sets:
  # Assumptions for fixed points:
  # - default point: [0.25, 0.0, 0.24]
  # - staging point: [0.30, -0.10, 0.20]
  # - warehouse point: temporarily reuse [0.30, -0.10, 0.20], replace as needed
#######################################################################################################
# 核心动作
# 统计: 当前核心块共 32 个动作
# 说明: 若按 无视觉/有视觉 x store/keep/discard x 200/200stand/neg200/400 统计应为 24，
#       但当前 discard 额外拆分为 left/right，因此实际是 32 个。
# 无视觉
# store
  - id: 41 #no_vision_catch_200_KFS_front_and_store
    name: no_vision_catch_200_KFS_front_and_store
    steps:
      - type: set_vacuum
        label: vacuum_on
        enabled: true

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [0.25, 0.0, 0.18]
        j5_target_pos: 0.0
        target_spin: 100.0

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [0.65, 0.0, 0.18]
        j5_target_pos: 0.0
        target_spin: 100.0

      - type: delay
        label: wait_after_move
        duration_sec: 0.5

      - type: set_payload_active
        label: payload_on
        enabled: true

      - type: send_can_frame
        label: notify # 完成抓取通知
        can_id: 0x602
        can_data: [0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xfc]

      - type: move_fixed_pose_mrl
        label: move_to_default_pose # 举高
        xyz: [0.1, 0.0, 0.8]
        j5_target_pos: 0.0
        target_spin: 100

      - type: move_fixed_pose_mrl
        label: move_to_default_pose # 转180度
        xyz: [-0.1, -0.0001, 0.8]
        j5_target_pos: 0.0
        target_spin: 100

      - type: delay
        label: wait_after_move
        duration_sec: 0.5

      - type: move_fixed_pose_mrl
        label: move_to_default_pose # 放置
        xyz: [-0.33, -0.0001, 0.48]
        j5_target_pos: 0.0
        target_spin: 0.0

      - type: move_fixed_pose_mrl
        label: move_to_default_pose # 放置
        xyz: [-0.34, -0.0001, 0.35]
        j5_target_pos: 0.0  
        target_spin: 0.0

      - type: set_payload_active
        label: payload_off
        enabled: false

      - type: set_vacuum
        label: vacuum_off
        enabled: false

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [-0.1, -0.0001, 0.8]
        j5_target_pos: 0.0
        target_spin: 90.0

      - type: move_fixed_pose_mrl
        label: move_to_default_pose
        xyz: [0.1, 0.0, 0.8]
        j5_target_pos: 0.0
        target_spin: 90.0

      - type: move_fixed_pose_mrl
        label: move_to_default_pose # 看前面
        xyz: [0.2171, 0.0, 0.1171]
        j5_target_pos: 0.0
        target_spin: 0.0

      - type: send_can_frame
        label: dm_serial_complete
        can_id: 0x500
        can_data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]


