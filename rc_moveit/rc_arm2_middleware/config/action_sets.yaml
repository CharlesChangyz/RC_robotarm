        xyz: [-0.31, -0.0001, 0.35]
        j5_target_pos: 0.0001
        target_spin: 0.0

      - type: set_payload_active
        label: payload_off # 松力
        enabled: false
      
      - type: set_vacuum
        label: vacuum_off # 关闭吸盘
        enabled: false

      - type: move_fixed_pose_mrl
